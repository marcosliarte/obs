<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamKit — Diagnóstico do Supabase</title>
<style>
  body { margin: 0; padding: 32px; background: #0a0b0d; color: #e6e8eb; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: #8c929b; margin: 0 0 20px; }
  button { height: 34px; padding: 0 14px; margin: 0 6px 6px 0; border: 1px solid #2e333a; border-radius: 6px; background: #171a1e; color: #e6e8eb; font: inherit; cursor: pointer; }
  button:hover { background: #1e2227; }
  pre { min-height: 120px; padding: 14px; background: #111316; border: 1px solid #22262c; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .ok { color: #3ccf8e; } .err { color: #f0645a; } .warn { color: #e8b33c; }
</style>
</head>
<body>
<main>
  <h1>Diagnóstico do Supabase</h1>
  <p>Os testes não alteram a configuração do seu overlay: a escrita usa uma linha separada (<code>__diagnostico__</code>).</p>
  <button onclick="testRead()">1. Ler configuração</button>
  <button onclick="testWrite()">2. Testar escrita</button>
  <button onclick="testLocked()">3. Conferir bloqueio sem chave</button>
  <pre id="out">Escolha um teste.</pre>
</main>

<script>
const SUPABASE_URL = 'https://lzfkwdirmwcuwgrgiguq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PeRkBtbqIR4XK5jvkrVz_g_MVVVWYPQ';
const OVERLAY_ID = new URLSearchParams(location.search).get('id') || 'default';
const TEST_ID = '__diagnostico__';
const writeKey = (() => { try { return localStorage.getItem('sk_write_key') || ''; } catch (_) { return ''; } })();

const out = document.getElementById('out');
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function log(msg, cls) { out.innerHTML += (cls ? `<span class="${cls}">${esc(msg)}</span>` : esc(msg)) + '\n'; }
function clear() { out.innerHTML = ''; }
const headers = extra => Object.assign({ 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, extra || {});

async function testRead() {
  clear();
  log(`Lendo a config "${OVERLAY_ID}"…`);
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config?id=eq.${encodeURIComponent(OVERLAY_ID)}&select=config,updated_at`, { headers: headers(), cache: 'no-store' });
    log(`HTTP ${r.status}`, r.ok ? 'ok' : 'err');
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) { log('A linha não existe. Rode supabase/setup.sql.', 'warn'); return; }
    const c = rows[0].config || {};
    log(`Atualizada em ${new Date(rows[0].updated_at).toLocaleString()}`);
    log(`Cena: ${c.state && c.state.scene} · Chat: ${c.CHAT && c.CHAT.mode} · Cor: ${c.state && c.state.color}`);
    log('\nLeitura funcionando.', 'ok');
  } catch (e) { log('Erro: ' + e.message, 'err'); }
}

async function testWrite() {
  clear();
  const marca = 'teste_' + Date.now();
  const config = { marca };
  log(writeKey ? 'Usando a chave de escrita salva neste navegador.' : 'Sem chave de escrita: testando escrita direta.');
  try {
    let ok;
    if (writeKey) {
      log('Atenção: a chave precisa existir para o id "__diagnostico__" em streamkit_keys.', 'warn');
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/streamkit_save`, { method: 'POST', headers: headers(), body: JSON.stringify({ p_id: TEST_ID, p_key: writeKey, p_config: config }) });
      log(`RPC: HTTP ${r.status}`, r.ok ? 'ok' : 'err');
      ok = r.ok;
    } else {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config`, {
        method: 'POST', headers: headers({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({ id: TEST_ID, config, updated_at: new Date().toISOString() })
      });
      log(`Upsert: HTTP ${r.status}`, r.ok ? 'ok' : 'err');
      ok = r.ok;
    }
    if (!ok) { log('\nEscrita recusada. Se você já ativou a proteção, isso é o esperado sem chave.', 'warn'); return; }
    const rr = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config?id=eq.${TEST_ID}&select=config`, { headers: headers(), cache: 'no-store' });
    const data = await rr.json();
    const lida = data && data[0] && data[0].config && data[0].config.marca;
    log(lida === marca ? '\nEscreveu e leu de volta a mesma marca.' : '\nA marca lida não confere.', lida === marca ? 'ok' : 'err');
  } catch (e) { log('Erro: ' + e.message, 'err'); }
}

async function testLocked() {
  clear();
  log('Tentando alterar a config real SEM chave (não muda nada: grava o mesmo valor)…');
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config?id=eq.${encodeURIComponent(OVERLAY_ID)}`, {
      method: 'PATCH', headers: headers({ Prefer: 'return=representation' }),
      body: JSON.stringify({ id: OVERLAY_ID })
    });
    const body = await r.text();
    const blocked = !r.ok || body === '[]';
    log(`HTTP ${r.status}`);
    log(blocked
      ? '\nProtegido: escrita anônima bloqueada.'
      : '\nDESPROTEGIDO: qualquer pessoa com a chave pública pode alterar o overlay. Rode supabase/setup.sql.',
      blocked ? 'ok' : 'err');
  } catch (e) { log('Erro: ' + e.message, 'err'); }
}
</script>
</body>
</html>
