<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Overlay Kit — Refatorado + Supabase</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Expanded:wght@800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #d6f24b;
    --accent-soft: rgba(214, 242, 75, 0.15);
    --bg: #0c0c0e; --bg-soft: #141417;
    --panel: rgba(255, 255, 255, 0.03); --panel-border: rgba(255, 255, 255, 0.09);
    --text: #f5f5f6; --text-dim: #8a8a92;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Archivo', sans-serif; background: #050506; color: var(--text); overflow-x: hidden; }

  /* ===================== PAINEL / CONTROLES ===================== */
  .controls, .react-editor { position: sticky; top: 0; z-index: 1000; background: rgba(8,8,10,0.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--panel-border); padding: 14px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .react-editor { top: 60px; display: none; background: var(--bg-soft); }
  .react-editor.show { display: flex; }
  h1 { font-family: 'Archivo Expanded', sans-serif; font-size: 14px; font-weight: 800; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .ctrl-group { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-dim); }
  
  button, select, input { font-family: inherit; font-size: 12px; outline: none; transition: 0.15s; }
  input[type="text"], input[type="number"], select { background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); border-radius: 8px; padding: 6px 10px; }
  input:focus { border-color: var(--accent); }
  .btn-seg { background: var(--bg-soft); border: 1px solid var(--panel-border); color: var(--text-dim); padding: 7px 13px; border-radius: 9px; cursor: pointer; font-weight: 600; }
  .btn-seg.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn-seg:not(.active):hover { color: var(--text); }
  
  .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; }
  .color-btn.active { border-color: #fff; transform: scale(1.1); }
  input[type="color"] { width: 26px; height: 26px; border: none; border-radius: 6px; background: none; cursor: pointer; }

  /* ===================== PALCO / STAGE ===================== */
  .stage-wrap { display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; min-height: 80vh; position: relative; }
  .stage { position: relative; background: var(--bg); overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.06); }
  .stage.landscape { width: min(1100px, 95vw); aspect-ratio: 16/9; }
  .stage.portrait { width: min(420px, 90vw); aspect-ratio: 9/16; }
  
  .bg-layer { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; pointer-events: none; }
  .scene-container { position: absolute; inset: 0; z-index: 1; }

  /* ===================== JANELAS ===================== */
  .win { position: absolute; background: var(--bg-soft); border: 1px solid var(--panel-border); display: flex; flex-direction: column; overflow: hidden; }
  .win.accent-frame::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--accent); pointer-events: none; animation: pulse 4s infinite; }
  .win-bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: rgba(0,0,0,0.25); border-bottom: 1px solid var(--panel-border); }
  .win-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); opacity: 0.4; }
  .win-dot.live { background: var(--accent); opacity: 1; animation: blink 2s infinite; }
  .win-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
  .win-title b { color: var(--accent); }
  .win-body { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  
  /* ===================== BADGES ===================== */
  .live-badge { position: absolute; top: 12px; left: 12px; z-index: 3; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; color: #fff; backdrop-filter: blur(8px); }
  .info-strip { position: absolute; display: flex; align-items: center; gap: 10px; background: var(--bg-soft); border: 1px solid var(--panel-border); border-radius: 12px; padding: 8px 14px; font-size: 12px; }
  
  /* ===================== MODO OBS ===================== */
  body.obs .controls, body.obs .react-editor { display: none !important; }
  body.obs .stage-wrap { padding: 0; margin: 0; width: 100vw; height: 100vh; }
  body.obs .stage { width: 100vw !important; height: 100vh !important; border: none; box-shadow: none; background: transparent !important; }
  body.obs .win, body.obs .win-body { background: transparent !important; }

  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="controls" id="mainControls">
  <h1>STREAM<span>KIT</span></h1>
  
  <div class="ctrl-group">Formato: 
    <button class="btn-seg active" data-cfg="format" data-val="landscape">16:9</button>
    <button class="btn-seg" data-cfg="format" data-val="portrait">9:16</button>
  </div>

  <div class="ctrl-group">Cena: 
    <select id="sceneSelect" data-bind="scene">
      <option value="game">Jogo</option>
      <option value="react">React</option>
      <option value="chatting">Just Chatting</option>
    </select>
  </div>

  <div class="ctrl-group">Cor:
    <button class="color-btn active" style="background:#d6f24b" data-color="#d6f24b"></button>
    <button class="color-btn" style="background:#5b8cff" data-color="#5b8cff"></button>
    <button class="color-btn" style="background:#ff5b7f" data-color="#ff5b7f"></button>
    <input type="color" id="customColor" value="#d6f24b" data-bind="color">
  </div>

  <div class="ctrl-group">Fundo:
    <select id="bgType" data-bind="bg.type">
      <option value="none">Transparente</option>
      <option value="solid">Sólido</option>
      <option value="image">URL Imagem</option>
    </select>
    <input type="color" id="bgColor" value="#0a0a0c" data-bind="bg.color">
    <input type="text" id="bgImg" placeholder="https://..." data-bind="bg.url" style="display:none; width:200px;">
  </div>

  <div id="sbStatus" style="margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim);">
    <span id="sbDot" style="width:8px;height:8px;border-radius:50%;background:#8a8a92;display:inline-block;"></span>
    <span id="sbMsg">Conectando...</span>
  </div>
</div>

<div class="react-editor" id="gameControls">
  <div class="ctrl-group">Jogo: <input type="text" data-bind="game.name" placeholder="Nome do Jogo"></div>
  <div class="ctrl-group">Nick: <input type="text" data-bind="game.nick" placeholder="@seunick"></div>
</div>

<div class="stage-wrap">
  <div class="stage landscape" id="stage">
    <div id="bgLayer" class="bg-layer"></div>
    <div id="sceneContainer" class="scene-container"></div>
  </div>
</div>

<script>
/* =========================================================================
   ESTADO GLOBAL
========================================================================= */
let state = {
  format: 'landscape',
  scene: 'game',
  color: '#d6f24b',
  bg: { type: 'none', color: '#0a0a0c', url: '' },
  game: { name: 'SEU JOGO AQUI', nick: '@seunick' }
};

const params = new URLSearchParams(location.search);
const isOBS = params.get('obs') === '1';
if (isOBS) document.body.classList.add('obs');

/* =========================================================================
   SUPABASE (Restaurado)
========================================================================= */
const SUPABASE_URL  = 'https://lzfkwdirmwcuwgrgiguq.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_PeRkBtbqIR4XK5jvkrVz_g_MVVVWYPQ';
const OVERLAY_ID    = 'default';
const POLL_INTERVAL = 2500;

function sbHeaders(extra) {
  return Object.assign({
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Prefer': 'resolution=merge-duplicates'
  }, extra || {});
}

function sbSetStatus(ok, msg) {
  const dot = document.getElementById('sbDot');
  const txt = document.getElementById('sbMsg');
  if (!dot || !txt) return;
  dot.style.background = ok ? '#34d399' : ok === null ? '#f59e0b' : '#f87171';
  txt.textContent = msg;
}

async function sbSave() {
  if (isOBS) return; // O OBS apenas lê, não salva
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config?id=eq.${OVERLAY_ID}`, {
      method: 'PATCH',
      headers: sbHeaders({ 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ config: state, updated_at: new Date().toISOString() })
    });
    if (r.ok) {
      sbSetStatus(true, 'Salvo ✓');
    } else if (r.status === 404 || r.status === 400) {
      const rp = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config`, {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ id: OVERLAY_ID, config: state, updated_at: new Date().toISOString() })
      });
      sbSetStatus(rp.ok, rp.ok ? 'Salvo ✓' : 'Erro ao salvar');
    } else {
      sbSetStatus(false, 'Erro (' + r.status + ')');
    }
  } catch(e) {
    sbSetStatus(false, 'Sem conexão');
  }
}

async function sbLoad() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/streamkit_config?id=eq.${OVERLAY_ID}&select=config&t=${Date.now()}`, { 
      headers: sbHeaders(), cache: 'no-store' 
    });
    if (!r.ok) { sbSetStatus(false, 'Erro ao carregar'); return null; }
    const rows = await r.json();
    sbSetStatus(true, 'Conectado ✓');
    if (rows && rows[0] && rows[0].config) return rows[0].config;
  } catch(e) {
    sbSetStatus(false, 'Sem conexão');
  }
  return null;
}

// Debounce para não spammar a API enquanto digita
let _saveTimer = null;
function triggerSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(sbSave, 600);
}

/* =========================================================================
   LÓGICA VISUAL (Refatorada sem bugs de tela)
========================================================================= */
function hexToRgba(hex, a) {
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.substring(0, 2), 16) || 0;
  const g = parseInt(hex.substring(2, 4), 16) || 0;
  const b = parseInt(hex.substring(4, 6), 16) || 0;
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function applyTheme() {
  document.documentElement.style.setProperty('--accent', state.color);
  document.documentElement.style.setProperty('--accent-soft', hexToRgba(state.color, 0.15));
}

function applyBackground() {
  const layer = document.getElementById('bgLayer');
  if(!layer) return;
  layer.style.background = ''; // reset
  if (state.bg.type === 'solid') {
    layer.style.backgroundColor = state.bg.color;
  } else if (state.bg.type === 'image' && state.bg.url) {
    layer.style.backgroundImage = `url('${state.bg.url}')`;
  }
}

const scenes = {
  game: () => `
    <div class="win" style="top:3%; left:2.5%; width:70%; height:84%;">
      <div class="win-bar"><span class="win-dot live"></span><span class="win-title">GAME<b>PLAY</b></span></div>
      <div class="win-body" style="background:#16161c;">🎮 Captura de Jogo</div>
    </div>
    <div class="win accent-frame" style="top:3%; right:2.5%; width:24%; height:28%;">
      <div class="win-body" style="background:#1f1f24;">📷 Webcam<div class="live-badge">AO VIVO</div></div>
    </div>
    <div class="win" style="bottom:3%; right:2.5%; width:24%; height:54%;">
      <div class="win-bar"><span class="win-dot"></span><span class="win-title">CHAT</span></div>
      <div class="win-body">Chat Aqui</div>
    </div>
    <div class="info-strip" style="bottom:3%; left:2.5%; width:70%;">
      <b>Jogando:</b> <span style="color:var(--accent)">${state.game.name}</span>
      <span style="margin-left:auto; color:var(--text-dim)">${state.game.nick}</span>
    </div>
  `,
  react: () => `
    <div class="win accent-frame" style="top:3%; left:2.5%; width:70%; height:84%;">
      <div class="win-bar"><span class="win-dot live"></span><span class="win-title">REA<b>CT</b></span></div>
      <div class="win-body" style="background:#1a1a2e;">▶️ Vídeo / Browser</div>
    </div>
    <div class="win" style="top:3%; right:2.5%; width:24%; height:28%;">
      <div class="win-body" style="background:#1f1f24;">📷 Webcam<div class="live-badge">AO VIVO</div></div>
    </div>
    <div class="win" style="bottom:3%; right:2.5%; width:24%; height:54%;">
      <div class="win-bar"><span class="win-dot"></span><span class="win-title">CHAT</span></div>
      <div class="win-body">Chat Aqui</div>
    </div>
  `,
  chatting: () => `
    <div class="win accent-frame" style="top:6%; left:3%; width:62%; height:80%;">
      <div class="win-bar"><span class="win-dot live"></span><span class="win-title">CÂMERA</span></div>
      <div class="win-body" style="background:#1f1f24;">📷 Just Chatting</div>
    </div>
    <div class="win" style="top:6%; right:3%; width:29%; height:80%;">
      <div class="win-bar"><span class="win-title">CHAT</span></div>
      <div class="win-body">Chat Aqui</div>
    </div>
  `
};

function renderScene() {
  const stage = document.getElementById('stage');
  const container = document.getElementById('sceneContainer');
  
  // No OBS, formato e cena vêm da URL. No painel, vêm do State.
  if (isOBS) {
    if (params.get('format')) state.format = params.get('format');
    if (params.get('scene')) state.scene = params.get('scene');
  }

  stage.className = `stage ${state.format}`;
  container.innerHTML = (scenes[state.scene] || scenes.game)();
  
  if (!isOBS) {
    document.getElementById('gameControls').classList.toggle('show', state.scene === 'game');
    document.getElementById('bgColor').style.display = state.bg.type === 'solid' ? '' : 'none';
    document.getElementById('bgImg').style.display = state.bg.type === 'image' ? '' : 'none';
    
    // Atualiza os inputs do painel para refletir o estado atual
    document.querySelector(`[data-bind="scene"]`).value = state.scene;
    document.querySelector(`[data-bind="bg.type"]`).value = state.bg.type;
    document.querySelector(`[data-bind="color"]`).value = state.color;
    document.querySelector(`[data-bind="game.name"]`).value = state.game.name;
    document.querySelector(`[data-bind="game.nick"]`).value = state.game.nick;
  }
}

/* =========================================================================
   INICIALIZAÇÃO & EVENTOS
========================================================================= */
(async () => {
  // 1. Carrega dados da nuvem
  const cloudData = await sbLoad();
  if (cloudData) {
    // Mescla os dados da nuvem com o estado atual com segurança
    state = { ...state, ...cloudData, game: { ...state.game, ...cloudData.game }, bg: { ...state.bg, ...cloudData.bg } };
  }

  // 2. Aplica visual
  applyTheme();
  applyBackground();
  renderScene();

  // 3. Se for o painel, liga os botões
  if (!isOBS) {
    // Binds de inputs dinâmicos
    document.querySelectorAll('[data-bind]').forEach(el => {
      el.addEventListener('input', e => {
        const keys = el.dataset.bind.split('.');
        if (keys.length === 2) state[keys[0]][keys[1]] = e.target.value;
        else state[keys[0]] = e.target.value;
        
        if (keys[0] === 'bg') applyBackground();
        else if (keys[0] === 'color') applyTheme();
        else renderScene();
        
        triggerSave();
      });
    });

    // Formato botões
    document.querySelectorAll('[data-cfg="format"]').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('[data-cfg="format"]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.format = e.target.dataset.val;
        renderScene();
        triggerSave();
      });
    });

    // Cores botões
    document.querySelector('.ctrl-group:nth-child(3)').addEventListener('click', e => {
      if (e.target.dataset.color) {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.color = e.target.dataset.color;
        document.getElementById('customColor').value = state.color;
        applyTheme();
        triggerSave();
      }
    });
  }

  // 4. Se for o OBS, inicia o loop de verificação (Polling)
  if (isOBS) {
    let lastStr = JSON.stringify(state);
    setInterval(async () => {
      const fresh = await sbLoad();
      if (!fresh) return;
      const str = JSON.stringify(fresh);
      if (str !== lastStr) {
        lastStr = str;
        state = { ...state, ...fresh, game: { ...state.game, ...fresh.game }, bg: { ...state.bg, ...fresh.bg } };
        applyTheme();
        applyBackground();
        renderScene();
      }
    }, POLL_INTERVAL);
  }
})();
</script>
</body>
</html>
